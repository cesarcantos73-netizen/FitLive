<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Información</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

<h1 style="font-family: Arial; font-size: 25px; color:brown;">
    Formulario de Información
</h1>

<form action="formulario.php" method="POST">

    <label for="usuario">Usuario:</label><br>
    <input type="text" id="usuario" value="anónimo" disabled><br><br>

    <label for="nombreyapellidos">Nombre y Apellidos:</label><br>
    <input type="text" id="nombreyapellidos" name="nombreyapellidos" maxlength="50" required><br><br>

    <label for="password">Contraseña:</label><br>
    <input type="password" id="password" name="password" maxlength="8" required><br><br>

    <label for="nivel">Nivel:</label><br>
    <select id="nivel" name="nivel">
        <option>Básico</option>
        <option selected>Avanzado</option>
        <option>Profesional</option>
    </select><br><br>

    <label for="newsletter">
        <input type="checkbox" id="newsletter" name="newsletter" checked>
        Deseo recibir información y promociones
    </label><br><br>

    <input type="submit" value="Enviar">
    <input type="reset" value="Reiniciar">

</form>

<p style="text-align:center;">
    <a href="index.html">Volver al inicio</a>
</p>

</body>
</html>
